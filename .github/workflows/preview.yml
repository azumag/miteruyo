name: Preview test ZIP

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use the pinned Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build preview ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/build-preview-zip.js

      - name: Upload preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
        uses: actions/upload-artifact@v4
        with:
          name: miteruyo-preview-${{ github.sha }}
          path: dist/preview/miteruyo-preview-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

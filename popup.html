<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miteruyo</title>
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      width: 330px;
      overflow-x: hidden;
    }

    /* Force volume slider track visibility */
    input[type=range]::-webkit-slider-runnable-track {
      background: #dee2e6;
      height: 4px;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="main" class="container">
    <div class="mb-3 mt-3">
      <div class="input-group has-validation">
        <label for="channelInput" class="visually-hidden">Channel name</label>
        <input type="text" class="form-control" id="channelInput"
          placeholder="Channel name">
        <button id="addChannelBtn" class="btn btn-primary">Add</button>
        <div class="invalid-feedback" data-i18n="invalidChannelName">Channel name must be 3-25 characters (letters, numbers, underscore)</div>
      </div>
      <div>
        <div class="container mt-3">
          <div class="row form-switch">
            <div class="col-5">
              <input type="checkbox" id="enableSwitch" class="form-check-input" role="switch" />
              <label class="form-check-label" for="enableSwitch">Enable</label>
            </div>
            <div class="col-7 text-end">
              <input type="checkbox" id="liveFilterSwitch" class="form-check-input" role="switch" />
              <label class="form-check-label" for="liveFilterSwitch">配信中のみ表示</label>
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <div class="spinner-border text-info mt-3" role="status" id="loading">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <table id="channelTable" class="table table-striped" style="min-width: 300px; table-layout: fixed;">
          <colgroup>
            <col style="width: 120px;">
            <col style="width: auto;">
            <col style="width: 60px;">
          </colgroup>
          <thead>
            <tr>
              <th scope="col"><span class="visually-hidden">Channel</span></th>
              <th scope="col"><span class="visually-hidden">Status</span></th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="channelTableBody"></tbody>
        </table>
      </div>
      <div class="accordion" id="configAccordion">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#collapseConfig" aria-expanded="false" aria-controls="collapseConfig">
              設定
            </button>
          </h2>
          <div id="collapseConfig" class="accordion-collapse collapse" data-bs-parent="#configAccordion">
            <div class="accordion-body m-0 p-0 pt-1">
              <table id="tbl" class="table table-striped mb-0 pb-0">
                <tbody>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center">
                        <input type="checkbox" id="openNewWindow" class="form-check-input me-2" />
                        <label for="openNewWindow" class="form-check-label small mb-0">新しいウィンドウで開く</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center mb-1">
                        <input type="checkbox" id="enableMaxTabs" class="form-check-input me-2" />
                        <label for="enableMaxTabs" class="form-check-label small mb-0">開くタブ数を制限</label>
                      </div>
                      <div class="d-flex align-items-center ps-4">
                        <input type="number" id="maxTabCount" class="form-control form-control-sm text-end me-1 flex-grow-1" min="1" max="20" />
                        <span id="maxTabUnit" class="small">タブ</span>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center mb-1">
                        <input type="checkbox" id="enableTabRotation" class="form-check-input me-2" />
                        <label for="enableTabRotation" class="form-check-label small mb-0">複数タブ自動切り替え</label>
                      </div>
                      <div class="d-flex align-items-center ps-4">
                        <input type="number" id="tabRotationInterval"
                          class="form-control form-control-sm text-end me-1 flex-grow-1" min="1" />
                        <span id="rotationUnit" class="small">分</span>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center mb-1">
                        <label for="checkInterval" class="form-check-label small mb-0 me-2">チェック間隔</label>
                      </div>
                      <div class="d-flex align-items-center ps-4">
                        <input type="number" id="checkInterval"
                          class="form-control form-control-sm text-end me-1 flex-grow-1" min="1" max="60" />
                        <span id="checkIntervalUnit" class="small">分</span>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center">
                        <input type="checkbox" id="enableTabMute" class="form-check-input me-2" />
                        <label for="enableTabMute" class="form-check-label small mb-0">非アクティブタブ自動ミュート</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center">
                        <input type="checkbox" id="enableAutoClose" class="form-check-input me-2" />
                        <label for="enableAutoClose" class="form-check-label small mb-0">オフラインチャネル自動閉じ</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center">
                        <input type="checkbox" id="autoOpenOnce" class="form-check-input me-2" />
                        <label for="autoOpenOnce" class="form-check-label small mb-0">一度開いたら再度開かない</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <div class="d-flex align-items-center">
                        <input type="checkbox" id="skipBrandedContent" class="form-check-input me-2" />
                        <label for="skipBrandedContent" class="form-check-label small mb-0">プロモーション配信を開かない</label>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" class="p-2">
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <span id="allowedOnlyCategoriesLabel" class="small">このカテゴリだけを開く</span>
                        <i id="allowedOnlyCategoriesHelpIcon" class="bi bi-question-circle-fill text-muted" style="cursor: help;" data-bs-toggle="tooltip" data-bs-title=""></i>
                      </div>
                      <div id="allowedOnlyCategoriesTagList" class="d-flex flex-wrap gap-1 mb-2"></div>
                      <div id="allowedOnlyCategoriesSearch"></div>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" class="p-2">
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <span id="blockedCategoriesLabel" class="small">このカテゴリを除外</span>
                        <i id="blockedCategoriesHelpIcon" class="bi bi-question-circle-fill text-muted" style="cursor: help;" data-bs-toggle="tooltip" data-bs-title=""></i>
                      </div>
                      <div id="blockedCategoriesTagList" class="d-flex flex-wrap gap-1 mb-2"></div>
                      <div id="blockedCategoriesSearch"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="mt-2 ps-2 mb-1">
              <div class="form-check form-switch d-flex align-items-center">
                <input class="form-check-input" type="checkbox" role="switch" id="enableNotifications">
                <label class="form-check-label mb-0 ms-2" for="enableNotifications">配信開始時にデスクトップ通知</label>
                <i id="notificationHelpIcon" class="bi bi-question-circle ms-1 text-muted" data-bs-toggle="tooltip"
                  data-bs-placement="top" title=""></i>
              </div>
            </div>
            <div class="mb-2 pe-3 text-end">
              <button id="aboutBtn" class="btn btn-link btn-sm text-decoration-none text-muted p-0">
                <i class="bi bi-info-circle"></i> <span id="aboutLabel">About</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-grid gap-2 mb-3 mt-3 ms-3 me-3" style="min-width: 200px">
    <button id="loginTwitch" class="btn btn-primary">
      Login Twitch
    </button>
  </div>
  <!-- About Modal -->
  <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title fs-6" id="aboutModalLabel">Miteruyo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body small">
          <div class="mb-2">
            <strong>Miteruyo</strong> <span id="aboutVersion"></span>
          </div>
          <div class="mb-3">
            <a href="https://github.com/azumag/miteruyo" target="_blank" class="text-decoration-none"
              id="githubLinkLabel">
              <i class="bi bi-github"></i> GitHub Repository
            </a>
          </div>
          <div class="bg-light p-2 rounded">
            <p class="mb-1" id="supportMessageLabel">If you like this extension, please consider supporting me!</p>
            <a href="https://ofuse.me/8fe1bedb" target="_blank" class="btn btn-danger btn-sm w-100">
              <i class="bi bi-heart-fill"></i> OFUSE
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
